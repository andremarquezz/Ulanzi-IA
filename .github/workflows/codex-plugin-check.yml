name: Codex plugin checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'plugin/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows close-helper syntax and window enumeration
        shell: pwsh
        run: |
          $result = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File plugin/resources/vscode-close-all.ps1 -Mode list | ConvertFrom-Json
          if ($result.success -ne $true) { throw "VS Code window helper failed smoke check" }
          Write-Host "Window helper loaded. Windows found: $(@($result.windows).Count)"
          $waitResult = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File plugin/resources/vscode-close-all.ps1 -Mode wait -MinimumCount 0 -TimeoutSeconds 0 | ConvertFrom-Json
          if ($waitResult.success -ne $true) { throw "VS Code wait-helper failed smoke check" }
          Write-Host "Window wait helper loaded."
